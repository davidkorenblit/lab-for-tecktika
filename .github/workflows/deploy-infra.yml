name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC federated login, no client secret stored
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION || 'swedencentral' }}"

      - name: Validate template
        run: |
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            --parameters entraTenantId="${{ secrets.AZURE_TENANT_ID }}" entraApiClientId="${{ secrets.ENTRA_API_CLIENT_ID }}"

      - name: Deploy
        run: |
          az deployment group create \
            --name "gha-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            --parameters entraTenantId="${{ secrets.AZURE_TENANT_ID }}" entraApiClientId="${{ secrets.ENTRA_API_CLIENT_ID }}"

      - name: Show outputs
        run: |
          az deployment group show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "gha-${{ github.run_id }}" \
            --query properties.outputs
