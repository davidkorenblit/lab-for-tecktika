name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC federated login, no client secret stored
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION || 'swedencentral' }}"

      # main.bicepparam already carries the real Entra tenant/client IDs (public
      # identifiers - they ship in the frontend bundle). Only override them when
      # a secret is actually set: an unset secret expands to an empty string,
      # which silently wiped AZURE_CLIENT_ID_API on the Container App and made
      # the backend return 503 on every authenticated request.
      - name: Build optional Entra parameter overrides
        id: entra
        env:
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
        run: |
          overrides=""
          if [ -n "$ENTRA_TENANT_ID" ]; then
            overrides="$overrides entraTenantId=$ENTRA_TENANT_ID"
          fi
          if [ -n "$ENTRA_API_CLIENT_ID" ]; then
            overrides="$overrides entraApiClientId=$ENTRA_API_CLIENT_ID"
          fi
          if [ -n "$overrides" ]; then
            overrides="--parameters$overrides"
          fi
          echo "overrides=$overrides" >> "$GITHUB_OUTPUT"

      - name: Validate template
        run: |
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            ${{ steps.entra.outputs.overrides }}

      - name: Deploy
        run: |
          az deployment group create \
            --name "gha-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            ${{ steps.entra.outputs.overrides }}

      - name: Show outputs
        run: |
          az deployment group show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "gha-${{ github.run_id }}" \
            --query properties.outputs
